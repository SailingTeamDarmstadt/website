{%- assign p = include.post -%}
<article class="card{% if p.pinned %} card--pinned{% endif %}">
  <a class="card-media" href="{{ p.url | relative_url }}" tabindex="-1" aria-hidden="true">
    {%- assign thumb = p.image | default: p.thumbnail -%}
    {%- if thumb %}
    <img src="{{ thumb | relative_url }}" alt="" loading="lazy">
    {%- else %}
    <span class="card-placeholder"><img src="{{ '/assets/img/logo-mark.png' | relative_url }}" alt=""></span>
    {%- endif %}
  </a>
  <div class="card-body">
    <p class="meta">{% if p.pinned %}<span class="pin-badge"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M16 3a1 1 0 0 1 .7 1.7L15 6.4v4.2l2.7 2.7a1 1 0 0 1-.7 1.7H13v6l-1 1-1-1v-6H7a1 1 0 0 1-.7-1.7L9 10.6V6.4L7.3 4.7A1 1 0 0 1 8 3h8Z"/></svg>Angepinnt</span>{% endif %}{% include date.html date=p.date %}</p>
    <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    <p>{{ p.excerpt | strip_html | truncatewords: 22 }}</p>
  </div>
</article>
